name: Build Godly Island APK (debug)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project & Detect APK Name
        id: loc
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            DIR="."
            APK_NAME="GodlyIsland-debug.apk"
          else
            COUNT="$(ls -1 ./*.zip 2>/dev/null | wc -l)"
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::Khong thay file .zip o thu muc goc repo"
              exit 1
            fi
            if [ "$COUNT" -gt 1 ]; then
              echo "::error::Co $COUNT file .zip o thu muc goc. Chi de lai 1 file duy nhat."
              ls -1 ./*.zip
              exit 1
            fi
            ZIP="$(ls -1 ./*.zip)"
            ZIP_BASENAME="$(basename "$ZIP" .zip)"
            echo "Giai nen: $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            
            # Tim file settings.gradle hoac settings.gradle.kts ben trong source giai nen
            FOUND="$(find _src -name settings.gradle.kts -o -name settings.gradle | head -n 1)"
            if [ -z "$FOUND" ]; then
              echo "::error::Trong $ZIP khong co settings.gradle hoac settings.gradle.kts"
              exit 1
            fi
            DIR="$(dirname "$FOUND")"
            APK_NAME="${ZIP_BASENAME}.apk"
          fi
          
          echo "Thu muc du an: $DIR"
          echo "Ten APK dau ra: $APK_NAME"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename and Prepare APK Output
        id: package
        run: |
          SRC_APK="$(find ${{ steps.loc.outputs.dir }} -name "*.apk" | grep -E "debug|unaligned" | head -n 1)"
          if [ -z "$SRC_APK" ]; then
            # Tim kiem tong quat neu khong thay theo filter
            SRC_APK="$(find ${{ steps.loc.outputs.dir }} -name "*.apk" | head -n 1)"
          fi
          
          if [ -z "$SRC_APK" ]; then
            echo "::error::Khong tim thay file APK nao sau khi build!"
            exit 1
          fi
          
          mkdir -p build_output
          DEST_APK="build_output/${{ steps.loc.outputs.apk_name }}"
          cp "$SRC_APK" "$DEST_APK"
          echo "Da dong goi APK tai: $DEST_APK"
          echo "path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodlyIsland-debug-apk
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GodlyIsland-build-reports
          path: ${{ steps.loc.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
          
